<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - CodeAlpha Store</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
        background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
      }

      .auth-card {
        background: white;
        border-radius: 15px;
        padding: 3rem;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      }

      .auth-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .auth-header h1 {
        color: #2c3e50;
        margin-bottom: 0.5rem;
      }

      .auth-header p {
        color: #7f8c8d;
      }

      .auth-logo {
        font-size: 3rem;
        color: #e74c3c;
        margin-bottom: 1rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #2c3e50;
        font-weight: 500;
      }

      .form-group input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #e74c3c;
        box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.2);
      }

      .error-message {
        color: #e74c3c;
        font-size: 0.9rem;
        margin-top: 0.5rem;
        min-height: 1.2rem;
      }

      .btn-submit {
        width: 100%;
        padding: 1rem;
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 1rem;
      }

      .btn-submit:hover {
        background: #c0392b;
      }

      .btn-submit:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
      }

      .auth-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #eee;
      }

      .auth-footer a {
        color: #3498db;
        text-decoration: none;
        font-weight: 500;
      }

      .auth-footer a:hover {
        text-decoration: underline;
      }

      .admin-warning {
        background: #fff3cd;
        border: 1px solid #ffeaa7;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1.5rem;
        color: #856404;
        font-size: 0.9rem;
      }

      @media (max-width: 480px) {
        .auth-card {
          padding: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Simple Navigation -->
    <nav style="background: #2c3e50; padding: 1rem">
      <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px">
        <a
          href="../index.html"
          style="
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 600;
          "
        >
          🛒 CodeAlpha Store
        </a>
      </div>
    </nav>

    <!-- Admin Login Form -->
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">
            <i class="fas fa-shield-alt"></i>
          </div>
          <h1>Admin Access</h1>
          <p>Restricted area - authorized personnel only</p>
        </div>

        <div class="admin-warning">
          <i class="fas fa-exclamation-triangle"></i>
          <strong> Warning:</strong> This area is restricted to administrators
          only.
        </div>

        <form id="adminLoginForm">
          <div class="form-group">
            <label for="email">Admin Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="admin@example.com"
            />
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Enter your password"
            />
            <div class="error-message"></div>
          </div>

          <button type="submit" class="btn-submit">Sign In as Admin</button>
        </form>

        <div class="auth-footer">
          <p>Regular user? <a href="login.html">Go to user login</a></p>
          <p style="margin-top: 1rem">
            <a href="../index.html">
              <i class="fas fa-arrow-left"></i> Back to Home
            </a>
          </p>
        </div>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="../js/admin-auth.js"></script>
  </body>
</html>
