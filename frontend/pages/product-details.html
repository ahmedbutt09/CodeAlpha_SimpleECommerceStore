<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - CodeAlpha Store</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .product-details-container {
            padding: 3rem 0;
        }
        
        .product-detail-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-bottom: 3rem;
        }
        
        .product-detail-image {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-detail-image img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
        
        .product-detail-info h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        
        .product-price {
            font-size: 2rem;
            color: #e74c3c;
            font-weight: 600;
            margin: 1rem 0;
        }
        
        .product-category {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        
        .product-stock {
            margin: 1.5rem 0;
            font-weight: 500;
        }
        
        .in-stock {
            color: #2ecc71;
        }
        
        .out-of-stock {
            color: #e74c3c;
        }
        
        .product-description {
            margin: 2rem 0;
            line-height: 1.8;
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .quantity-btn {
            width: 40px;
            height: 40px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .quantity-input {
            width: 60px;
            text-align: center;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1.1rem;
        }
        
        .product-actions {
            display: flex;
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .btn-add-cart, .btn-buy {
            flex: 1;
            padding: 1rem 2rem;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-add-cart {
            background: #3498db;
            color: white;
        }
        
        .btn-add-cart:hover {
            background: #2980b9;
        }
        
        .btn-buy {
            background: #2ecc71;
            color: white;
        }
        
        .btn-buy:hover {
            background: #27ae60;
        }
        
        .btn-add-cart:disabled,
        .btn-buy:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .product-meta {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin-top: 2rem;
        }
        
        .product-meta p {
            margin: 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .product-meta i {
            color: #3498db;
        }
        
        .back-to-shop {
            text-align: center;
            margin-top: 3rem;
        }
        
        @media (max-width: 768px) {
            .product-detail-content {
                grid-template-columns: 1fr;
            }
            
            .product-detail-info h1 {
                font-size: 2rem;
            }
            
            .product-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="../index.html">🛒 CodeAlpha Store</a>
            </div>
            
            <div class="nav-links">
                <a href="../index.html"><i class="fas fa-home"></i> Home</a>
                <a href="cart.html" id="cartLink">
                    <i class="fas fa-shopping-cart"></i> Cart 
                    <span class="cart-count">0</span>
                </a>
                <div class="auth-buttons">
                    <!-- Will be populated by JavaScript -->
                    <a href="login.html" class="btn-login">Login</a>
                    <a href="register.html" class="btn-register">Register</a>
                </div>
            </div>
            
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Product Details -->
    <main class="container product-details-container">
        <div id="productDetails">
            <!-- Product details will be loaded here -->
            <div class="loading">Loading product details...</div>
        </div>
        
        <div class="back-to-shop">
            <a href="../index.html" class="btn-view">
                <i class="fas fa-arrow-left"></i> Back to Shop
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-section">
                <h3>CodeAlpha Store</h3>
                <p>Your one-stop shop for all needs</p>
            </div>
            <div class="footer-section">
                <h4>Quick Links</h4>
                <a href="../index.html">Home</a>
                <a href="../index.html#products">Products</a>
                <a href="cart.html">Cart</a>
            </div>
            <div class="footer-section">
                <h4>Contact</h4>
                <p>Email: support@codealpha.com</p>
                <p>Phone: +1 234 567 890</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 CodeAlpha E-Commerce Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="../js/app.js"></script>
    <script>
        let currentProduct = null;
        let currentQuantity = 1;
        
        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();
            checkAuthStatus();
            loadProductDetails();
        });
        
        async function loadProductDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
            if (!productId) {
                window.location.href = '../index.html';
                return;
            }
            
            try {
                const response = await fetch(`http://localhost:5000/api/products/${productId}`);
                
                if (!response.ok) {
                    throw new Error('Product not found');
                }
                
                currentProduct = await response.json();
                displayProductDetails();
                
            } catch (error) {
                console.error('Error loading product:', error);
                document.getElementById('productDetails').innerHTML = `
                    <div class="error">
                        <h3>Product not found</h3>
                        <p>${error.message}</p>
                        <a href="../index.html" class="btn-view">Back to Home</a>
                    </div>
                `;
            }
        }
        
        function displayProductDetails() {
            if (!currentProduct) return;
            
            const productDetailsDiv = document.getElementById('productDetails');
            
            productDetailsDiv.innerHTML = `
                <div class="product-detail-content">
                    <div class="product-detail-image">
                        <img src="${currentProduct.image || 'https://via.placeholder.com/500x400?text=Product+Image'}" 
                             alt="${currentProduct.name}"
                             onerror="this.src='https://via.placeholder.com/500x400?text=Product+Image'">
                    </div>
                    <div class="product-detail-info">
                        <h1>${currentProduct.name}</h1>
                        <div class="product-category">${currentProduct.category}</div>
                        <div class="product-price">$${currentProduct.price.toFixed(2)}</div>
                        <div class="product-stock ${currentProduct.stock > 0 ? 'in-stock' : 'out-of-stock'}">
                            ${currentProduct.stock > 0 
                                ? `In Stock (${currentProduct.stock} available)`
                                : 'Out of Stock'}
                        </div>
                        <div class="product-description">
                            <h3>Description</h3>
                            <p>${currentProduct.description}</p>
                        </div>
                        <div class="quantity-control">
                            <label for="quantity"><strong>Quantity:</strong></label>
                            <button class="quantity-btn" onclick="decreaseQuantity()">-</button>
                            <input type="number" id="quantity" value="1" min="1" max="${currentProduct.stock}" 
                                   onchange="updateQuantity(this.value)">
                            <button class="quantity-btn" onclick="increaseQuantity()">+</button>
                        </div>
                        <div class="product-actions">
                            <button class="btn-add-cart" onclick="addToCartFromDetails()" 
                                    ${currentProduct.stock === 0 ? 'disabled' : ''}>
                                <i class="fas fa-cart-plus"></i> Add to Cart
                            </button>
                            <button class="btn-buy" onclick="buyNow()" 
                                    ${currentProduct.stock === 0 ? 'disabled' : ''}>
                                <i class="fas fa-bolt"></i> Buy Now
                            </button>
                        </div>
                        <div class="product-meta">
                            <p><i class="fas fa-shipping-fast"></i> Free shipping on orders over $50</p>
                            <p><i class="fas fa-undo-alt"></i> 30-day return policy</p>
                            <p><i class="fas fa-shield-alt"></i> Secure checkout</p>
                            <p><i class="fas fa-tag"></i> Best price guaranteed</p>
                        </div>
                    </div>
                </div>
            `;
            
            updateQuantityInput();
        }
        
        function decreaseQuantity() {
            if (currentQuantity > 1) {
                currentQuantity--;
                updateQuantityInput();
            }
        }
        
        function increaseQuantity() {
            if (currentProduct && currentQuantity < currentProduct.stock) {
                currentQuantity++;
                updateQuantityInput();
            }
        }
        
        function updateQuantity(value) {
            const quantity = parseInt(value);
            if (!isNaN(quantity) && quantity >= 1) {
                if (currentProduct && quantity > currentProduct.stock) {
                    currentQuantity = currentProduct.stock;
                } else {
                    currentQuantity = quantity;
                }
                updateQuantityInput();
            }
        }
        
        function updateQuantityInput() {
            const quantityInput = document.getElementById('quantity');
            if (quantityInput) {
                quantityInput.value = currentQuantity;
            }
        }
        
        function addToCartFromDetails() {
            if (!currentProduct) return;
            
            addToCart(currentProduct._id, currentProduct.name, currentProduct.price, currentProduct.image, currentQuantity);
            showToast(`Added ${currentQuantity} ${currentProduct.name}(s) to cart!`);
        }
        
        function buyNow() {
            if (!currentProduct) return;
            
            // Add to cart and redirect to checkout
            addToCart(currentProduct._id, currentProduct.name, currentProduct.price, currentProduct.image, currentQuantity);
            window.location.href = 'cart.html?checkout=true';
        }
        
        function addToCart(productId, productName, price, image, quantity = 1) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            // Check if product already in cart
            const existingItem = cart.find(item => item.productId === productId);
            
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({
                    productId,
                    name: productName,
                    price: price,
                    quantity: quantity,
                    image: image || `https://via.placeholder.com/100x100?text=${encodeURIComponent(productName)}`
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
        }
        
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartCount = document.querySelector('.cart-count');
            if (cartCount) {
                cartCount.textContent = totalItems;
            }
        }
        
        function showToast(message, type = 'success') {
            // Remove existing toast
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            // Create new toast
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            // Remove toast after 3 seconds
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        async function checkAuthStatus() {
            const token = localStorage.getItem('token');
            const authButtons = document.querySelector('.auth-buttons');
            
            if (!authButtons) return;
            
            if (token) {
                try {
                    const response = await fetch('http://localhost:5000/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const user = await response.json();
                        authButtons.innerHTML = `
                            <span class="welcome">Welcome, ${user.username}</span>
                            <a href="#" onclick="logout()" class="btn-login">Logout</a>
                        `;
                    } else {
                        localStorage.removeItem('token');
                    }
                } catch (error) {
                    console.error('Error checking auth status:', error);
                    localStorage.removeItem('token');
                }
            }
        }
        
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.reload();
        }
        
        window.logout = logout;
    </script>
</body>
</html>
