<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - CodeAlpha Store</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .auth-card {
        background: white;
        border-radius: 15px;
        padding: 3rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }

      .auth-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .auth-header h1 {
        color: #2c3e50;
        margin-bottom: 0.5rem;
      }

      .auth-header p {
        color: #7f8c8d;
      }

      .auth-logo {
        font-size: 3rem;
        color: #3498db;
        margin-bottom: 1rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #2c3e50;
        font-weight: 500;
      }

      .form-group input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      }

      .error-message {
        color: #e74c3c;
        font-size: 0.9rem;
        margin-top: 0.5rem;
        min-height: 1.2rem;
      }

      .success-message {
        color: #2ecc71;
        font-size: 0.9rem;
        margin-top: 0.5rem;
        min-height: 1.2rem;
      }

      .btn-submit {
        width: 100%;
        padding: 1rem;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 1rem;
      }

      .btn-submit:hover {
        background: #2980b9;
      }

      .btn-submit:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
      }

      .auth-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #eee;
      }

      .auth-footer a {
        color: #3498db;
        text-decoration: none;
        font-weight: 500;
      }

      .auth-footer a:hover {
        text-decoration: underline;
      }

      .instructions {
        background: #f8f9fa;
        padding: 1rem;
        border-radius: 8px;
        margin: 1.5rem 0;
        font-size: 0.9rem;
        color: #7f8c8d;
      }

      .instructions i {
        color: #3498db;
        margin-right: 0.5rem;
      }

      @media (max-width: 480px) {
        .auth-card {
          padding: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Simple Navigation -->
    <nav style="background: #2c3e50; padding: 1rem">
      <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px">
        <a
          href="../index.html"
          style="
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 600;
          "
        >
          🛒 CodeAlpha Store
        </a>
      </div>
    </nav>

    <!-- Forgot Password Form -->
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">
            <i class="fas fa-key"></i>
          </div>
          <h1>Reset Password</h1>
          <p>Enter your email to receive reset instructions</p>
        </div>

        <div class="instructions">
          <p>
            <i class="fas fa-info-circle"></i> We'll send you an email with a
            link to reset your password. The link will expire in 1 hour.
          </p>
        </div>

        <form id="forgotPasswordForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="Enter your registered email"
            />
            <div class="error-message" id="emailError"></div>
            <div class="success-message" id="emailSuccess"></div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            Send Reset Link
          </button>
        </form>

        <div class="auth-footer">
          <p>Remember your password? <a href="login.html">Sign in here</a></p>
          <p style="margin-top: 1rem">
            <a href="../index.html">
              <i class="fas fa-arrow-left"></i> Back to Home
            </a>
          </p>
        </div>
      </div>
    </div>

    <!-- JavaScript -->
    <script>
      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const submitBtn = document.getElementById("submitBtn");
          const errorDiv = document.getElementById("emailError");
          const successDiv = document.getElementById("emailSuccess");

          // Clear previous messages
          errorDiv.textContent = "";
          successDiv.textContent = "";

          // Show loading state
          const originalText = submitBtn.textContent;
          submitBtn.textContent = "Sending...";
          submitBtn.disabled = true;

          try {
            // For demo purposes - simulate API call
            // In a real app, you would call your backend API
            await new Promise((resolve) => setTimeout(resolve, 1000));

            // Simulate successful response
            successDiv.textContent =
              "Password reset link has been sent to your email!";
            successDiv.style.display = "block";

            // Reset form
            document.getElementById("forgotPasswordForm").reset();

            // Show success message
            showToast("Reset link sent successfully! Check your email.");

            // Update button text
            submitBtn.textContent = "Send Again";
          } catch (error) {
            errorDiv.textContent =
              "Failed to send reset link. Please try again.";
            submitBtn.textContent = originalText;
          } finally {
            submitBtn.disabled = false;
          }
        });

      function showToast(message, type = "success") {
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.textContent = message;

        document.body.appendChild(toast);

        setTimeout(() => {
          toast.remove();
        }, 3000);
      }
    </script>
  </body>
</html>
